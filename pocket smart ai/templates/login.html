<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - PocketSmart AI</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <h1>💰 PocketSmart AI</h1>

    <h2>✨ Welcome Back!</h2>

    <p style="text-align: center;">
        Login to manage your smart budget
    </p>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <form method="POST" action="{{ url_for('login') }}">

        <input
            type="text"
            name="username"
            placeholder="👤 Enter Username"
            required
        >

        <input
            type="password"
            name="password"
            placeholder="🔒 Enter Password"
            required
        >

        <button type="submit">
            🚀 Login
        </button>

    </form>

    <hr>

    <p style="text-align: center;">
        New to PocketSmart AI?
    </p>

    <a href="{{ url_for('register') }}">
        ✨ Create New Account
    </a>

</div>

</body>
</html>
