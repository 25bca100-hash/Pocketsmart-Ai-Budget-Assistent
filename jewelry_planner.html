<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jewelry Planner - PocketSmart AI</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <h1>💎 Jewelry Planner</h1>

    <p>Plan your jewelry budget easily with PocketSmart AI.</p>

    <form method="POST">

        <label for="budget">Your Budget (₹)</label>

        <input
            type="number"
            id="budget"
            name="budget"
            placeholder="Enter your budget"
            min="1"
            required
        >

        <label for="jewelry_type">Jewelry Type</label>

        <select id="jewelry_type" name="jewelry_type" required>

            <option value="">Select Jewelry</option>

            <option value="Gold Ring">
                Gold Ring
            </option>

            <option value="Gold Chain">
                Gold Chain
            </option>

            <option value="Gold Earrings">
                Gold Earrings
            </option>

            <option value="Gold Bracelet">
                Gold Bracelet
            </option>

            <option value="Necklace">
                Necklace
            </option>

            <option value="Silver Jewelry">
                Silver Jewelry
            </option>

        </select>

        <label for="occasion">Occasion</label>

        <select id="occasion" name="occasion" required>

            <option value="">Select Occasion</option>

            <option value="Wedding">
                Wedding
            </option>

            <option value="Birthday">
                Birthday
            </option>

            <option value="Festival">
                Festival
            </option>

            <option value="Daily Wear">
                Daily Wear
            </option>

            <option value="Gift">
                Gift
            </option>

        </select>

        <button type="submit">
            💎 Create Jewelry Plan
        </button>

    </form>


    {% if result %}

    <div class="result">

        <h2>✨ Your Jewelry Plan</h2>

        <p>{{ result }}</p>

    </div>

    {% endif %}


    <a href="{{ url_for('dashboard') }}">
        ← Back to Dashboard
    </a>

</div>

</body>
</html>
